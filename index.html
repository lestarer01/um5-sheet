<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UM5 Character Sheet</title>
  <link rel="stylesheet" href="style.css" />
  <script src="database.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header>
    <h1>ULTRAMODERN5</h1>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" data-tab="tab-list">1: Operatives</button>
    <button class="tab-btn" data-tab="tab-core">2: Core Stats</button>
    <button class="tab-btn" data-tab="tab-combat">3: Combat</button>
    <button class="tab-btn" data-tab="tab-skills">4: Skills</button>
    <button class="tab-btn" data-tab="tab-abilities">5: Abilities</button>
    <button class="tab-btn" data-tab="tab-magic">6: Magic</button>
  </nav>

  <main>
    <!-- TAB 1: OPERATIVES -->
    <section id="tab-list" class="tab-page active">
      <div class="card">
        <h2>Operative Roster</h2>
        <button id="btn-new" class="btn">+ Create New Operative</button>
        <div id="roster-list" style="margin-top: 15px;"></div>
      </div>
    </section>

    <!-- TAB 2: CORE STATS -->
    <section id="tab-core" class="tab-page">
      <div class="card">
        <div class="grid-2">
          <div class="field-group"><label>Name</label><input type="text" id="c-name"></div>
          <div class="field-group"><label>Species</label><input type="text" id="c-species"></div>
        </div>
        <div class="grid-2">
          <div class="field-group"><label>Background</label><input type="text" id="c-bg"></div>
          <div class="field-group"><label>Archetype</label><input type="text" id="c-archetype"></div>
        </div>
        <div class="grid-3">
          <div class="field-group"><label>Ladder</label><select id="c-ladder"></select></div>
          <div class="field-group"><label>Class</label><select id="c-class"></select></div>
          <div class="field-group"><label>Level</label><input type="number" id="c-lvl" value="1"></div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><label>STR</label><input type="number" id="s-str" value="10"></div>
        <div class="stat-box"><label>DEX</label><input type="number" id="s-dex" value="10"></div>
        <div class="stat-box"><label>CON</label><input type="number" id="s-con" value="10"></div>
        <div class="stat-box"><label>INT</label><input type="number" id="s-int" value="10"></div>
        <div class="stat-box"><label>WIS</label><input type="number" id="s-wis" value="10"></div>
        <div class="stat-box"><label>CHA</label><input type="number" id="s-cha" value="10"></div>
      </div>

      <div class="card">
        <div class="grid-3">
          <div class="field-group"><label>Max HP</label><input type="number" id="hp-max" value="10"></div>
          <div class="field-group"><label>Current HP</label><input type="number" id="hp-cur" value="10"></div>
          <div class="field-group"><label>Temp HP</label><input type="number" id="hp-temp" value="0"></div>
        </div>
        <div class="grid-3">
          <div class="field-group"><label>Armor Class</label><input type="number" id="ac-val" value="10"></div>
          <div class="field-group"><label>Speed</label><input type="number" id="spd-val" value="30"></div>
          <div class="field-group"><label>Proficiency</label><input type="text" id="prof-val" value="+2" readonly></div>
        </div>
        <div class="death-saves">
          <div class="ds-group"><label>SUCCESS</label> <input type="checkbox" id="ds-s1"> <input type="checkbox" id="ds-s2"> <input type="checkbox" id="ds-s3"></div>
          <div class="ds-group"><label>FAIL</label> <input type="checkbox" id="ds-f1"> <input type="checkbox" id="ds-f2"> <input type="checkbox" id="ds-f3"></div>
        </div>
      </div>
    </section>

    <!-- TAB 3: COMBAT -->
    <section id="tab-combat" class="tab-page">
      <div class="card">
        <h3>Armor</h3>
        <div class="field-group">
          <label>Equip Armor Preset (Changes AC automatically)</label>
          <select id="armor-preset" onchange="applyArmor()"></select>
        </div>
      </div>

      <div class="card">
        <h3>Primary Weapon</h3>
        <select id="w1-preset" onchange="applyWpn(1)" style="margin-bottom:10px;"></select>
        <div class="grid-2">
          <div class="field-group"><label>Name</label><input type="text" id="w1-name"></div>
          <div class="field-group"><label>Damage</label><input type="text" id="w1-dmg"></div>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button class="btn" onclick="fire(1)">SHOOT</button>
          <button class="btn" onclick="reload(1)" style="background:var(--success-color);">RELOAD</button>
        </div>
        <p style="margin-top:10px; font-size:0.8rem;">Ammo: <span id="w1-cur">30</span> / <input type="number" id="w1-max" style="width:60px;"></p>
      </div>
    </section>

    <!-- TAB 4: SKILLS -->
    <section id="tab-skills" class="tab-page">
      <div class="card" id="skills-container"></div>
    </section>

    <!-- TAB 5: ABILITIES -->
    <section id="tab-abilities" class="tab-page">
      <div class="card">
        <h3 style="color:var(--accent-secondary);">Ladder & Class Features</h3>
        <div id="abilities-box" style="margin-bottom:20px;"></div>
        <h3>Custom Features</h3>
        <textarea id="c-notes" rows="6" placeholder="Add custom feats or cyberware here..."></textarea>
      </div>
    </section>

    <!-- TAB 6: MAGIC -->
    <section id="tab-magic" class="tab-page">
      <div class="card">
        <h3>Dark System Magic</h3>
        <div class="grid-2">
          <div class="field-group"><label>Max Mana / MP</label><input type="number" id="mp-max"></div>
          <div class="field-group"><label>Current Mana</label><input type="number" id="mp-cur"></div>
        </div>
        <div class="grid-2">
          <div class="field-group"><label>Spell Save DC</label><input type="number" id="spell-dc"></div>
          <div class="field-group"><label>Spell Attack Bonus</label><input type="number" id="spell-atk"></div>
        </div>
        <div class="field-group" style="margin-top:10px;">
          <label>Spells Known</label>
          <textarea id="spell-list" rows="8" placeholder="List spells and effects here..."></textarea>
        </div>
      </div>
    </section>
  </main>
</body>
</html>

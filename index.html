<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UM5 Tactical Character Sheet</title>
  <link rel="stylesheet" href="style.css" />
  <script src="database.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>ULTRAMODERN5</h1>
      <p class="subtitle">Tactical Operative System</p>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="page-list">Operatives</button>
      <button class="tab-btn" data-tab="page-sheet">Tactical</button>
      <button class="tab-btn" data-tab="page-skills">Skills</button>
      <button class="tab-btn" data-tab="page-abilities">Abilities</button>
    </nav>

    <main class="content-area">

      <!-- PAGE 1: OPERATIVE SELECTION -->
      <section id="page-list" class="tab-page active">
        <div class="card">
          <h2>Operative Roster</h2>
          <button id="btn-new-char" class="btn primary-btn">+ New Operative</button>
          <div id="character-list" class="char-list-container"></div>
        </div>
      </section>

      <!-- PAGE 2: MAIN CHARACTER SHEET -->
      <section id="page-sheet" class="tab-page">
        <!-- PROFILE SECTION -->
        <div class="card profile-card">
          <!-- Row 1: Name & Species -->
          <div class="grid-2">
            <div class="field-group">
              <label for="char-name">Character Name</label>
              <input type="text" id="char-name" placeholder="e.g. Jax Vance" />
            </div>
            <div class="field-group">
              <label for="char-species">Species / Genetic Origin</label>
              <input type="text" id="char-species" placeholder="e.g. Human, Cyborg" />
            </div>
          </div>

          <!-- Row 2: Background & Archetype -->
          <div class="grid-2" style="margin-top: 10px;">
            <div class="field-group">
              <label for="char-background">Background</label>
              <input type="text" id="char-background" placeholder="e.g. Mercenary" />
            </div>
            <div class="field-group">
              <label for="char-archetype">Archetype / Subclass</label>
              <input type="text" id="char-archetype" placeholder="e.g. Sharpshooter" />
            </div>
          </div>

          <!-- Row 3: Ladder, Class, Level -->
          <div class="grid-3" style="margin-top: 10px;">
            <div class="field-group">
              <label for="char-ladder">Ladder</label>
              <select id="char-ladder"></select>
            </div>
            <div class="field-group">
              <label for="char-class">Class</label>
              <select id="char-class"></select>
            </div>
            <div class="field-group">
              <label for="char-level">Level</label>
              <input type="number" id="char-level" value="1" min="1" max="20" />
            </div>
          </div>
        </div>

        <!-- STATS GRID -->
        <div class="stats-grid">
          <div class="stat-box">
            <label>STR</label>
            <input type="number" id="stat-str" value="10" />
            <span class="mod-display" id="mod-str">+0</span>
          </div>
          <div class="stat-box">
            <label>DEX</label>
            <input type="number" id="stat-dex" value="10" />
            <span class="mod-display" id="mod-dex">+0</span>
          </div>
          <div class="stat-box">
            <label>CON</label>
            <input type="number" id="stat-con" value="10" />
            <span class="mod-display" id="mod-con">+0</span>
          </div>
          <div class="stat-box">
            <label>INT</label>
            <input type="number" id="stat-int" value="10" />
            <span class="mod-display" id="mod-int">+0</span>
          </div>
          <div class="stat-box">
            <label>WIS</label>
            <input type="number" id="stat-wis" value="10" />
            <span class="mod-display" id="mod-wis">+0</span>
          </div>
          <div class="stat-box">
            <label>CHA</label>
            <input type="number" id="stat-cha" value="10" />
            <span class="mod-display" id="mod-cha">+0</span>
          </div>
        </div>

        <!-- DERIVED STATS -->
        <div class="card derived-stats">
          <div>Proficiency: <strong id="prof-bonus-display">+2</strong></div>
          <div>Passive Perception: <strong id="passive-perception-display">10</strong></div>
        </div>

        <!-- HP & DEFENSE -->
        <div class="card combat-card">
          <h3>Combat & Vitality</h3>
          <div class="grid-3">
            <div class="field-group">
              <label>HP Max</label>
              <input type="number" id="hp-max" value="10" />
            </div>
            <div class="field-group">
              <label>Current HP</label>
              <input type="number" id="hp-current" value="10" />
            </div>
            <div class="field-group">
              <label>Temp HP</label>
              <input type="number" id="hp-temp" value="0" />
            </div>
          </div>
          <div class="grid-2">
            <div class="field-group">
              <label>Armor Class (AC)</label>
              <input type="number" id="ac-val" value="10" />
            </div>
            <div class="field-group">
              <label>Speed (ft)</label>
              <input type="number" id="speed-val" value="30" />
            </div>
          </div>
        </div>

        <!-- WEAPONS -->
        <div class="card weapons-card">
          <h3>Firearms & Arsenal</h3>

          <!-- Primary Weapon -->
          <div class="weapon-block">
            <h4>Primary Weapon</h4>
            <div class="field-group">
              <label>Select Preset</label>
              <select id="wpn-1-preset" onchange="applyWeaponPreset(1)"></select>
            </div>
            <div class="grid-2">
              <div class="field-group">
                <label>Weapon Name</label>
                <input type="text" id="wpn-1-name" oninput="markCustom(1)" placeholder="e.g. M4 Carbine" />
              </div>
              <div class="field-group">
                <label>Damage</label>
                <input type="text" id="wpn-1-damage" oninput="markCustom(1)" placeholder="2d6" />
              </div>
            </div>
            <div class="grid-2">
              <div class="field-group">
                <label>Range</label>
                <input type="text" id="wpn-1-range" oninput="markCustom(1)" placeholder="80/300" />
              </div>
              <div class="field-group">
                <label>Properties</label>
